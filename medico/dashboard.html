<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel del médico · MediCitas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container pb-5">
    <h1 class="h3 mb-1" data-testid="titulo-dashboard-medico">Hola, <span id="texto-nombre-medico" data-testid="texto-nombre-medico"></span> 👋</h1>
    <p class="text-muted mb-4">Especialidad: <span id="texto-especialidad-medico" data-testid="texto-especialidad-medico"></span></p>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card dashboard-stat shadow-sm h-100">
          <div class="card-body">
            <p class="text-muted mb-1 small">Citas de hoy</p>
            <h2 class="mb-0" id="stat-citas-hoy" data-testid="stat-citas-hoy">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card dashboard-stat stat-warning shadow-sm h-100">
          <div class="card-body">
            <p class="text-muted mb-1 small">Pendientes de confirmar</p>
            <h2 class="mb-0" id="stat-citas-pendientes" data-testid="stat-citas-pendientes">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card dashboard-stat stat-secondary shadow-sm h-100">
          <div class="card-body">
            <p class="text-muted mb-1 small">Pacientes atendidos</p>
            <h2 class="mb-0" id="stat-pacientes-atendidos" data-testid="stat-pacientes-atendidos">0</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5"><i class="bi bi-lightning"></i> Acciones rápidas</h2>
        <div class="d-flex gap-2 flex-wrap">
          <a href="agenda.html" class="btn btn-primary" id="btn-ir-agenda" data-testid="btn-ir-agenda">
            <i class="bi bi-calendar-week"></i> Ver agenda del día
          </a>
          <a href="horarios.html" class="btn btn-outline-primary" id="btn-ir-horarios" data-testid="btn-ir-horarios">
            <i class="bi bi-clock-history"></i> Gestionar horarios
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/pages/medico-dashboard.js"></script>
</body>
</html>
