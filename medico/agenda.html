<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda diaria · MediCitas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container pb-5">
    <h1 class="h3 mb-3" data-testid="titulo-agenda">Agenda diaria</h1>

    <div id="agenda-alert-container" data-testid="agenda-alert-container"></div>

    <div class="mb-3" style="max-width: 260px;">
      <label for="input-fecha-agenda" class="form-label">Fecha</label>
      <input type="date" class="form-control" id="input-fecha-agenda" data-testid="input-fecha-agenda">
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white" data-testid="tabla-agenda">
        <thead>
          <tr>
            <th>Hora</th>
            <th>Paciente</th>
            <th>DNI</th>
            <th>Teléfono</th>
            <th>Motivo</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-agenda" data-testid="tbody-agenda"></tbody>
      </table>
    </div>
    <p class="text-muted d-none" id="texto-sin-citas-agenda" data-testid="texto-sin-citas-agenda">
      No tienes citas programadas para esta fecha.
    </p>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/pages/medico-agenda.js"></script>
</body>
</html>
