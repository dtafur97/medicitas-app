<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis horarios · MediCitas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container pb-5">
    <h1 class="h3 mb-3" data-testid="titulo-horarios">Gestión de horarios</h1>

    <div id="horarios-alert-container" data-testid="horarios-alert-container"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3"><i class="bi bi-plus-circle"></i> Crear franjas de atención</h2>
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="input-nueva-franja-fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="input-nueva-franja-fecha" data-testid="input-nueva-franja-fecha">
          </div>
          <div class="col-md-3">
            <label for="input-nueva-franja-inicio" class="form-label">Hora inicio</label>
            <input type="time" class="form-control" id="input-nueva-franja-inicio" data-testid="input-nueva-franja-inicio" value="08:00">
          </div>
          <div class="col-md-3">
            <label for="input-nueva-franja-fin" class="form-label">Hora fin</label>
            <input type="time" class="form-control" id="input-nueva-franja-fin" data-testid="input-nueva-franja-fin" value="13:00">
          </div>
          <div class="col-md-3">
            <button class="btn btn-primary w-100" id="btn-crear-franjas" data-testid="btn-crear-franjas">
              <i class="bi bi-plus-lg"></i> Crear franjas (30 min)
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="mb-3" style="max-width: 260px;">
      <label for="input-filtro-fecha-horarios" class="form-label">Ver horarios de la fecha</label>
      <input type="date" class="form-control" id="input-filtro-fecha-horarios" data-testid="input-filtro-fecha-horarios">
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white" data-testid="tabla-horarios">
        <thead>
          <tr>
            <th>Hora</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-horarios" data-testid="tbody-horarios"></tbody>
      </table>
    </div>
    <p class="text-muted d-none" id="texto-sin-horarios" data-testid="texto-sin-horarios">
      No hay franjas registradas para esta fecha.
    </p>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../js/pages/medico-horarios.js"></script>
</body>
</html>
