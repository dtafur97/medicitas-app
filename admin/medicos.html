<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de médicos · MediCitas</title>
  <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold"><i class="bi bi-hospital"></i> MediCitas</span>
      </div>
    </nav>
  </div>

  <main class="container pb-5">
    <h1 class="h3 mb-3" data-testid="titulo-medicos">Gestión de médicos</h1>

    <div id="medicos-alert-container" data-testid="medicos-alert-container"></div>

    <div class="mb-3" style="max-width: 320px;">
      <label for="input-buscar-medico" class="form-label">Buscar médico</label>
      <input type="text" class="form-control" id="input-buscar-medico" data-testid="input-buscar-medico" placeholder="Nombre o especialidad...">
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white" data-testid="tabla-medicos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Especialidad</th>
            <th>Colegiatura</th>
            <th>Correo</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-medicos" data-testid="tbody-medicos"></tbody>
      </table>
    </div>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../js/pages/admin-medicos.js"></script>
</body>
</html>
