<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · MediCitas</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-hospital text-primary" style="font-size: 2.5rem;"></i>
          <h1 class="h3 mt-2 mb-0">MediCitas</h1>
          <p class="text-muted small">Sistema de Gestión de Citas Médicas</p>
        </div>

        <div id="login-alert-container" data-testid="login-alert-container"></div>

        <form id="form-login" data-testid="form-login" novalidate>
          <div class="mb-3">
            <label for="input-login-email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="input-login-email" data-testid="input-login-email"
              placeholder="usuario@demo.com" required>
            <div class="invalid-feedback" id="error-login-email" data-testid="error-login-email"></div>
          </div>
          <div class="mb-3">
            <label for="input-login-password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="input-login-password" data-testid="input-login-password"
              placeholder="••••••" required>
            <div class="invalid-feedback" id="error-login-password" data-testid="error-login-password"></div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="btn-login-submit" data-testid="btn-login-submit">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
          </button>
        </form>

        <p class="text-center mt-3 mb-0">
          ¿No tienes cuenta?
          <a href="register.html" id="link-ir-registro" data-testid="link-ir-registro">Regístrate aquí</a>
        </p>

        <hr>

        <div class="demo-credentials" data-testid="demo-credentials-box">
          <p class="fw-semibold mb-2"><i class="bi bi-info-circle"></i> Credenciales de demostración</p>
          <ul class="list-unstyled mb-0">
            <li data-testid="demo-cred-paciente"><strong>Paciente:</strong> paciente@demo.com / 123456</li>
            <li data-testid="demo-cred-medico"><strong>Médico:</strong> medico@demo.com / 123456</li>
            <li data-testid="demo-cred-recepcionista"><strong>Recepcionista:</strong> recepcion@demo.com / 123456</li>
            <li data-testid="demo-cred-admin"><strong>Administrador:</strong> admin@demo.com / 123456</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
