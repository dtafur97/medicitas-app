<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar cita · MediCitas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold"><i class="bi bi-hospital"></i> MediCitas</span>
      </div>
    </nav>
  </div>

  <main class="container pb-5">
    <h1 class="h3 mb-3" data-testid="titulo-reservar">Reservar una cita</h1>

    <div id="reservar-alert-container" data-testid="reservar-alert-container"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="select-especialidad" class="form-label">Especialidad</label>
            <select class="form-select" id="select-especialidad" data-testid="select-especialidad">
              <option value="">Selecciona una especialidad</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="select-medico" class="form-label">Médico</label>
            <select class="form-select" id="select-medico" data-testid="select-medico" disabled>
              <option value="">Selecciona un médico</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="input-fecha-reserva" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="input-fecha-reserva" data-testid="input-fecha-reserva" disabled>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3"><i class="bi bi-clock"></i> Horarios disponibles</h2>
        <div id="grid-horarios" data-testid="grid-horarios">
          <p class="text-muted mb-0" id="texto-seleccione-filtros" data-testid="texto-seleccione-filtros">
            Selecciona especialidad, médico y fecha para ver los horarios disponibles.
          </p>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3"><i class="bi bi-clipboard-check"></i> Confirmar reserva</h2>
        <p class="mb-2">Horario seleccionado: <strong id="texto-horario-seleccionado" data-testid="texto-horario-seleccionado">Ninguno</strong></p>
        <div class="mb-3">
          <label for="input-motivo-cita" class="form-label">Motivo de la consulta (opcional)</label>
          <textarea class="form-control" id="input-motivo-cita" data-testid="input-motivo-cita" rows="2"></textarea>
        </div>
        <button class="btn btn-primary" id="btn-reservar-cita" data-testid="btn-reservar-cita" disabled>
          <i class="bi bi-calendar-check"></i> Reservar cita
        </button>
      </div>
    </div>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../js/pages/paciente-reservar.js"></script>
</body>
</html>
