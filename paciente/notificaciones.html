<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notificaciones · MediCitas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold"><i class="bi bi-hospital"></i> MediCitas</span>
      </div>
    </nav>
  </div>

  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0" data-testid="titulo-notificaciones">Centro de notificaciones</h1>
      <button class="btn btn-outline-primary btn-sm" id="btn-marcar-todas-leidas" data-testid="btn-marcar-todas-leidas">
        <i class="bi bi-check2-all"></i> Marcar todas como leídas
      </button>
    </div>

    <div id="lista-notificaciones" data-testid="lista-notificaciones" class="list-group"></div>
    <p class="text-muted mt-3 d-none" id="texto-sin-notificaciones" data-testid="texto-sin-notificaciones">
      No tienes notificaciones.
    </p>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../js/pages/paciente-notificaciones.js"></script>
</body>
</html>
