<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis citas · MediCitas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container pb-5">
    <h1 class="h3 mb-3" data-testid="titulo-mis-citas">Mis citas</h1>

    <div id="mis-citas-alert-container" data-testid="mis-citas-alert-container"></div>

    <div class="mb-3" style="max-width: 300px;">
      <label for="select-filtro-estado" class="form-label">Filtrar por estado</label>
      <select class="form-select" id="select-filtro-estado" data-testid="select-filtro-estado">
        <option value="todas">Todas</option>
        <option value="pendiente">Pendiente</option>
        <option value="confirmada">Confirmada</option>
        <option value="cancelada">Cancelada</option>
        <option value="atendida">Atendida</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white" data-testid="tabla-mis-citas">
        <thead>
          <tr>
            <th>Código</th>
            <th>Especialidad</th>
            <th>Médico</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-mis-citas" data-testid="tbody-mis-citas"></tbody>
      </table>
    </div>
    <p class="text-muted d-none" id="texto-sin-citas" data-testid="texto-sin-citas">No tienes citas registradas con ese filtro.</p>

    <div class="card shadow-sm d-none" id="panel-reprogramar" data-testid="panel-reprogramar">
      <div class="card-body">
        <h2 class="h5 mb-3"><i class="bi bi-arrow-repeat"></i> Reprogramar cita <span id="texto-reprogramar-codigo" data-testid="texto-reprogramar-codigo"></span></h2>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="input-reprogramar-fecha" class="form-label">Nueva fecha</label>
            <input type="date" class="form-control" id="input-reprogramar-fecha" data-testid="input-reprogramar-fecha">
          </div>
        </div>
        <div id="grid-reprogramar-horarios" data-testid="grid-reprogramar-horarios" class="mb-3">
          <p class="text-muted mb-0">Selecciona una nueva fecha para ver los horarios disponibles.</p>
        </div>
        <button class="btn btn-primary" id="btn-confirmar-reprogramar" data-testid="btn-confirmar-reprogramar" disabled>
          <i class="bi bi-check2"></i> Confirmar reprogramación
        </button>
        <button class="btn btn-outline-secondary" id="btn-cancelar-reprogramar" data-testid="btn-cancelar-reprogramar">
          Cerrar
        </button>
      </div>
    </div>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/pages/paciente-mis-citas.js"></script>
</body>
</html>
