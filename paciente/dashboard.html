<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel del paciente · MediCitas</title>
  <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold"><i class="bi bi-hospital"></i> MediCitas</span>
      </div>
    </nav>
  </div>

  <main class="container pb-5">
    <h1 class="h3 mb-1" data-testid="titulo-dashboard-paciente">Hola, <span id="texto-nombre-paciente" data-testid="texto-nombre-paciente"></span> 👋</h1>
    <p class="text-muted mb-4">Este es tu panel de citas médicas.</p>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card dashboard-stat stat-warning shadow-sm h-100">
          <div class="card-body">
            <p class="text-muted mb-1 small">Citas pendientes</p>
            <h2 class="mb-0" id="stat-citas-pendientes" data-testid="stat-citas-pendientes">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card dashboard-stat stat-success shadow-sm h-100">
          <div class="card-body">
            <p class="text-muted mb-1 small">Citas confirmadas</p>
            <h2 class="mb-0" id="stat-citas-confirmadas" data-testid="stat-citas-confirmadas">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card dashboard-stat shadow-sm h-100">
          <div class="card-body">
            <p class="text-muted mb-1 small">Notificaciones sin leer</p>
            <h2 class="mb-0" id="stat-notificaciones-no-leidas" data-testid="stat-notificaciones-no-leidas">0</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5"><i class="bi bi-calendar-event"></i> Próxima cita</h2>
            <div id="proxima-cita-container" data-testid="proxima-cita-container">
              <p class="text-muted mb-0" data-testid="texto-sin-proxima-cita">No tienes citas próximas.</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5"><i class="bi bi-lightning"></i> Acciones rápidas</h2>
            <div class="d-grid gap-2">
              <a href="especialidades.html" class="btn btn-primary" id="btn-ir-especialidades" data-testid="btn-ir-especialidades">
                <i class="bi bi-search"></i> Buscar especialidad
              </a>
              <a href="reservar.html" class="btn btn-outline-primary" id="btn-ir-reservar" data-testid="btn-ir-reservar">
                <i class="bi bi-calendar-plus"></i> Reservar una cita
              </a>
              <a href="mis-citas.html" class="btn btn-outline-secondary" id="btn-ir-mis-citas" data-testid="btn-ir-mis-citas">
                <i class="bi bi-list-check"></i> Ver mis citas
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../js/pages/paciente-dashboard.js"></script>
</body>
</html>
