<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Especialidades · MediCitas</title>
  <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar-container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold"><i class="bi bi-hospital"></i> MediCitas</span>
      </div>
    </nav>
  </div>

  <main class="container pb-5">
    <h1 class="h3 mb-3" data-testid="titulo-especialidades">Especialidades médicas</h1>

    <div class="mb-4">
      <label for="input-buscar-especialidad" class="form-label">Buscar especialidad</label>
      <input type="text" class="form-control" id="input-buscar-especialidad" data-testid="input-buscar-especialidad"
        placeholder="Ej. Cardiología, dermatología...">
    </div>

    <div class="row g-3" id="lista-especialidades" data-testid="lista-especialidades"></div>

    <p class="text-muted mt-3 d-none" id="texto-sin-resultados" data-testid="texto-sin-resultados">
      No se encontraron especialidades que coincidan con tu búsqueda.
    </p>
  </main>

  <footer class="app-footer">MediCitas &copy; 2026 · Sistema de Gestión de Citas Médicas</footer>

  <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../js/pages/paciente-especialidades.js"></script>
</body>
</html>
